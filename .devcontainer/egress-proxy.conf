# The dev container's egress proxy. init-firewall.sh redirects every outbound
# HTTPS connection here; this reads the name the client asked for from the
# TLS ClientHello (SNI) without decrypting anything, and either connects to
# that name itself or closes the connection.
#
# It connects to the name's own address, looked up here, never to the
# address the client dialled -- so a client cannot pair an allowed name with
# an address of its choosing, and an unlisted site that shares a CDN address
# with a listed one is still refused.

user www-data;
worker_processes 1;
pid /run/egress-proxy.pid;
error_log /var/log/egress-proxy/error.log warn;

# Debian ships the stream module as a dynamic module.
include /etc/nginx/modules-enabled/*.conf;

events {}

stream {
    # `resolver ...;`, written by init-firewall.sh from /etc/resolv.conf.
    include /etc/egress-proxy/resolver.conf;
    resolver_timeout 5s;

    map $ssl_preread_server_name $egress_decision {
        hostnames;
        # `<name> allow;` lines, generated from allowed-domains.txt.
        include /etc/egress-proxy/allowed-domains.map;
        default deny;
    }

    # A refused connection is sent to a closed local port, so the client's
    # handshake fails straight away.
    map $egress_decision $egress_upstream {
        allow   $ssl_preread_server_name:443;
        default 127.0.0.1:1;
    }

    log_format egress '$time_iso8601 $egress_decision $ssl_preread_server_name $upstream_addr';
    access_log /var/log/egress-proxy/access.log egress;

    server {
        listen 127.0.0.1:8443;
        ssl_preread on;
        proxy_pass $egress_upstream;
        proxy_connect_timeout 10s;
    }
}
