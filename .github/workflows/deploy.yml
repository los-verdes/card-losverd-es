name: Deploy

# Merges to main deploy staging, then production (staging first, so D1
# migrations and the deploy itself are exercised there before production).
# "Run workflow" from any branch deploys that branch to staging only, to try
# a change against the test BigCommerce store before merging.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# `CLOUDFLARE_API_TOKEN` is shared with terraform/ -- see terraform/README.md's
# "API token permissions" section for its current scope and the tracked
# least-privilege follow-up (issue #15).
jobs:
  terraform:
    # Only for merged code: a manual staging deploy from an unmerged branch
    # must never apply that branch's Terraform to shared infrastructure
    # (which includes production's resources).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      # Provisions/reconciles every environment's D1 database, R2 bucket, and
      # queues before anything that depends on them runs -- full GitOps.
      # Calls the lower-level `tf` recipe directly (not the 1Password-oriented
      # `tf-init`/`tf-apply` shortcuts) so this step's non-interactive,
      # auto-approved behavior is visible right here.
      - name: Terraform init
        run: just tf init -input=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Terraform apply
        run: just tf apply -input=false -auto-approve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  staging:
    needs: terraform
    # Runs after terraform on push, and without it (terraform is skipped) on
    # a manual run.
    if: ${{ !cancelled() && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://card-losverd-es-staging.jeff-hogan1.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # The steps below only need the Cloudflare token -- never the R2
      # remote-state AWS_* credentials, which only Terraform uses.
      - name: Apply D1 migrations
        run: just db-migrate-remote staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Syncs the committed template images (assets/templates/**) into R2
      # before the Worker that reads them deploys.
      - name: Upload R2 template assets
        run: just r2-upload-templates staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging

  production:
    needs: staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      # TODO: https://card.losverd.es once DNS is cut over (Phase 8).
      url: https://card-losverd-es.jeff-hogan1.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Apply D1 migrations
        run: just db-migrate-remote production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload R2 template assets
        run: just r2-upload-templates production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # `--env=""` explicitly targets the top-level (production) config.
          # The action's own `environment` input can't express this (it drops
          # an empty string), and omitting it makes Wrangler warn about
          # multiple environments with no target.
          command: deploy --env=""
