name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

# `CLOUDFLARE_API_TOKEN` needs: Account Settings:Read, D1:Edit, Workers Scripts:Edit
# (shared with terraform/ -- see terraform/README.md's "API token permissions" section
# for the known gaps and the token's expiration/renewal note).
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://cf-card.losverd.es
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - uses: extractions/setup-just@v2
      - run: npm ci
      - name: Apply D1 migrations
        run: just db-migrate-remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          environment: production
