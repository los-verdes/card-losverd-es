name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

# `CLOUDFLARE_API_TOKEN` is shared with terraform/ -- see terraform/README.md's
# "API token permissions" section for its current scope and the tracked
# least-privilege follow-up (issue #15).
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://cf-card.losverd.es
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # Provisions/reconciles the D1 database + R2 bucket before anything
      # that depends on them runs (D1 migrations, Worker deploy) -- full
      # GitOps: infra changes committed to terraform/ apply automatically on
      # merge to main, same as app code changes deploy automatically.
      # Bypasses the `tf-init`/`tf-apply` justfile shortcuts (which are
      # tuned for interactive local use via 1Password) and calls the
      # lower-level `tf` recipe directly so this step's exact behavior --
      # non-interactive, auto-approved -- is visible right here rather than
      # split across two files.
      - name: Terraform init
        run: just tf init -input=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Terraform apply
        run: just tf apply -input=false -auto-approve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Apply D1 migrations
        run: just db-migrate-remote
        env:
          # `just db-migrate-remote` is a plain `wrangler d1 migrations
          # apply` -- it never touches Terraform or the S3/R2 state backend,
          # so this step deliberately does NOT receive AWS_ACCESS_KEY_ID/
          # AWS_SECRET_ACCESS_KEY (those are the R2 remote-state credentials,
          # only needed by the Terraform steps above -- see
          # terraform/README.md). No step in this workflow needs them.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          environment: production
