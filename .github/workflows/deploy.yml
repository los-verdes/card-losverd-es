name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

# `CLOUDFLARE_API_TOKEN` is shared with terraform/ -- see terraform/README.md's
# "API token permissions" section for its current scope and the tracked
# least-privilege follow-up (issue #15).
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://cf-card.losverd.es
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - uses: extractions/setup-just@v2
      - run: npm ci
      - name: Apply D1 migrations
        run: just db-migrate-remote
        env:
          # `just db-migrate-remote` is a plain `wrangler d1 migrations
          # apply` -- it never touches Terraform or the S3/R2 state backend,
          # so this step deliberately does NOT receive AWS_ACCESS_KEY_ID/
          # AWS_SECRET_ACCESS_KEY (those are the R2 remote-state credentials,
          # only needed by `just tf-*`, which CI doesn't run -- see
          # terraform/README.md). No step in this workflow needs them.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          environment: production
