name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - uses: extractions/setup-just@v2
      - run: npm ci
      - run: just typecheck
      - run: just lint
      - run: just test-coverage
