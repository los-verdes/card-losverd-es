name = "card-losverd-es"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

# Non-JS static assets bundled directly into the Worker via Wrangler's
# esbuild-based bundler at build time (rather than fetched at request time or
# read from R2). `src/cardimage/render.ts` needs this for the raw Bungee
# font buffer Satori requires; the `.png` glob also covers
# `test/fixtures/sample-logo.png`, imported the same way by that module's
# tests. `.wasm` needs no entry here -- Wrangler resolves that to a
# WebAssembly.Module by default.
[[rules]]
type = "Data"
globs = ["**/*.woff", "**/*.png"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "card-losverd-es-db"
database_id = "6ff0c181-2a0c-43ab-9c16-2c9d78827d6f"
# Wrangler defaults to looking for a top-level `migrations/` directory --
# ours lives at src/db/migrations (see Phase 2.1). Without this, `wrangler
# d1 migrations apply` fails with "No migrations present at .../migrations"
# -- this is why every Deploy workflow run has failed since the very first
# merge to main.
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "card-losverd-es-assets"

[vars]
# BigCommerce store/app identifiers - not secret, safe to commit (see
# docs/bigcommerce-ingestion.md).
BIGCOMMERCE_STORE_HASH = "REPLACE_WITH_BIGCOMMERCE_STORE_HASH"
BIGCOMMERCE_CLIENT_ID = "REPLACE_WITH_BIGCOMMERCE_CLIENT_ID"
# Placeholders only, so local dev/test envs have *something* bound (matches
# the `REPLACE_WITH_TERRAFORM_OUTPUT_...` pattern above). Real values MUST
# be set per-environment via `wrangler secret put` before deploying - see
# docs/bigcommerce-ingestion.md sections 1 and 5.
BIGCOMMERCE_ACCESS_TOKEN = "REPLACE_WITH_WRANGLER_SECRET"
BIGCOMMERCE_WEBHOOK_SIGNING_KEY = "REPLACE_WITH_WRANGLER_SECRET"

# Apple PassKit identifiers (Phase 4) - not secret, safe to commit (both are
# embedded in every issued pass). These are the legacy app's real values
# (`APPLE_DEVELOPER_PASS_TYPE_ID` / `APPLE_DEVELOPER_TEAM_ID` in
# digital-membership): the pass type ID must match the Apple Pass Type ID
# certificate used for signing, and is also the APNs push topic -- see
# docs/legacy-pass-compatibility.md.
PASSKIT_PASS_TYPE_IDENTIFIER = "pass.es.losverd.card"
PASSKIT_TEAM_IDENTIFIER = "KJHZP635V9"
PASSKIT_ORGANIZATION_NAME = "Los Verdes"
PASSKIT_WEB_SERVICE_URL = "https://card.losverd.es/passkit"
# Real Apple Pass Type ID cert/key + WWDR intermediate aren't available in
# this environment yet (see the migration plan's Phase 0.2 credential
# inventory) - placeholders only, per the same pattern as the BigCommerce
# secrets above.
APPLE_PASS_CERT_PEM = "REPLACE_WITH_WRANGLER_SECRET"
APPLE_PASS_KEY_PEM = "REPLACE_WITH_WRANGLER_SECRET"
APPLE_WWDR_CERT_PEM = "REPLACE_WITH_WRANGLER_SECRET"

# Sign in with Apple identifiers (Phase 2.3.2, src/auth/authjs.ts) - not
# secret, the legacy app's real values. The key ID/private key and Google
# OAuth credentials are secrets with deliberately no placeholder here (see
# SESSION_SIGNING_KEY in src/index.ts): set via `wrangler secret put`.
AUTH_APPLE_ID = "es.losverd.card"
APPLE_SIGNIN_TEAM_ID = "KJHZP635V9"

# Cloudflare Queues (Phase 2.5.2). The queues themselves are provisioned by
# terraform/queues.tf; bindings live here. src/index.ts's queue() handler
# routes batches by queue name.
[[queues.producers]]
queue = "etl-sync"
binding = "ETL_SYNC_QUEUE"

# Concurrency 1: a webhook-triggered order sync and a scheduled full resync
# never race each other's D1 writes, and BigCommerce rate limits aren't hit
# by parallel syncs (Phase 2.5.1).
[[queues.consumers]]
queue = "etl-sync"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 5
max_concurrency = 1
dead_letter_queue = "etl-sync-dlq"

[[queues.consumers]]
queue = "etl-sync-dlq"
max_batch_size = 10
max_retries = 0

# No [triggers] crons yet: the scheduled ETL jobs (src/scheduled.ts) would
# call BigCommerce with placeholder credentials until real secrets are set.

# `[env.production]` deliberately does NOT exist: Wrangler's named
# environments do not inherit top-level `vars`/`d1_databases`/`r2_buckets`
# at all (confirmed the hard way -- see the migration plan's Handoff note
# for how this was caught: the first real CI deploy using
# `--env production` silently shipped a Worker with every binding
# missing, `/healthz` still worked since it needs none, but every other
# route 500'd). Since `env.production`'s Worker name was identical to the
# top-level one anyway, deploying via the unqualified top-level config
# (see justfile's `deploy-prod` / deploy.yml) is both simpler and correct,
# with zero risk of the two configs drifting apart.
#
# `env.preview` deliberately gets NO queue bindings: a queue can only have one
# consumer, so declaring one here would steal production's, and a producer
# would feed preview traffic into production's queue. Without the binding,
# enqueueEtlSync() logs and drops messages in preview.
#
# `env.preview` is a genuinely distinct Worker (different name), so it
# needs -- and gets -- its own copy of every binding below. It currently
# points at the *same* D1 database and R2 bucket as production (no
# separate preview resources are provisioned in Terraform yet) -- fine for
# now given this project's no-SLA risk posture, but means preview testing
# can affect real data. Worth revisiting before relying on it for the
# Phase 8 pre-cutover validation the migration plan describes.
[env.preview]
name = "card-losverd-es-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "card-losverd-es-db"
database_id = "6ff0c181-2a0c-43ab-9c16-2c9d78827d6f"
migrations_dir = "src/db/migrations"

[[env.preview.r2_buckets]]
binding = "ASSETS"
bucket_name = "card-losverd-es-assets"

[env.preview.vars]
BIGCOMMERCE_STORE_HASH = "REPLACE_WITH_BIGCOMMERCE_STORE_HASH"
BIGCOMMERCE_CLIENT_ID = "REPLACE_WITH_BIGCOMMERCE_CLIENT_ID"
BIGCOMMERCE_ACCESS_TOKEN = "REPLACE_WITH_WRANGLER_SECRET"
BIGCOMMERCE_WEBHOOK_SIGNING_KEY = "REPLACE_WITH_WRANGLER_SECRET"
PASSKIT_PASS_TYPE_IDENTIFIER = "pass.es.losverd.card"
PASSKIT_TEAM_IDENTIFIER = "KJHZP635V9"
PASSKIT_ORGANIZATION_NAME = "Los Verdes"
PASSKIT_WEB_SERVICE_URL = "https://card.losverd.es/passkit"
APPLE_PASS_CERT_PEM = "REPLACE_WITH_WRANGLER_SECRET"
APPLE_PASS_KEY_PEM = "REPLACE_WITH_WRANGLER_SECRET"
APPLE_WWDR_CERT_PEM = "REPLACE_WITH_WRANGLER_SECRET"
AUTH_APPLE_ID = "es.losverd.card"
APPLE_SIGNIN_TEAM_ID = "KJHZP635V9"
