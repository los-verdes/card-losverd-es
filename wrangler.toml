name = "card-losverd-es"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

# Non-JS static assets bundled directly into the Worker via Wrangler's
# esbuild-based bundler at build time (rather than fetched at request time or
# read from R2). `src/cardimage/render.ts` needs this for the raw Bungee
# font buffer Satori requires; the `.png` glob also covers
# `test/fixtures/sample-logo.png`, imported the same way by that module's
# tests. `.wasm` needs no entry here -- Wrangler resolves that to a
# WebAssembly.Module by default.
[[rules]]
type = "Data"
globs = ["**/*.woff", "**/*.png"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "card-losverd-es-db"
database_id = "6ff0c181-2a0c-43ab-9c16-2c9d78827d6f"
# Wrangler defaults to looking for a top-level `migrations/` directory --
# ours lives at src/db/migrations (see Phase 2.1). Without this, `wrangler
# d1 migrations apply` fails with "No migrations present at .../migrations"
# -- this is why every Deploy workflow run has failed since the very first
# merge to main.
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "card-losverd-es-assets"

[vars]
# BigCommerce store/app identifiers - not secret, safe to commit (see
# docs/bigcommerce-ingestion.md). Still placeholders: set the real values.
# BIGCOMMERCE_ACCESS_TOKEN and BIGCOMMERCE_WEBHOOK_SIGNING_KEY are secrets,
# set via `wrangler secret put` -- deliberately with NO placeholder here:
# `wrangler secret put` refuses a name already bound as a plain var, and a
# public placeholder signing key would let anyone forge webhook signatures.
BIGCOMMERCE_STORE_HASH = "REPLACE_WITH_BIGCOMMERCE_STORE_HASH"
BIGCOMMERCE_CLIENT_ID = "REPLACE_WITH_BIGCOMMERCE_CLIENT_ID"

# Apple PassKit identifiers (Phase 4) - not secret, safe to commit (both are
# embedded in every issued pass). These are the legacy app's real values
# (`APPLE_DEVELOPER_PASS_TYPE_ID` / `APPLE_DEVELOPER_TEAM_ID` in
# digital-membership): the pass type ID must match the Apple Pass Type ID
# certificate used for signing, and is also the APNs push topic -- see
# docs/legacy-pass-compatibility.md.
PASSKIT_PASS_TYPE_IDENTIFIER = "pass.es.losverd.card"
PASSKIT_TEAM_IDENTIFIER = "KJHZP635V9"
PASSKIT_ORGANIZATION_NAME = "Los Verdes"
PASSKIT_WEB_SERVICE_URL = "https://card.losverd.es/passkit"
# Public origin for the signed /verify-pass URLs in membership card QR codes.
PUBLIC_BASE_URL = "https://card.losverd.es"
# Google Wallet (Phase 5). The issuer ID is the legacy app's. The legacy
# pass used a *loyalty* class; this stack issues *generic* objects, so this
# generic class must be created in the Google Pay & Wallet Console.
GOOGLE_WALLET_ISSUER_ID = "3388000000022031577"
GOOGLE_WALLET_CLASS_SUFFIX = "los_verdes_member_v1"
# The Apple Pass Type ID cert/key + WWDR intermediate (APPLE_PASS_CERT_PEM,
# APPLE_PASS_KEY_PEM, APPLE_WWDR_CERT_PEM) are secrets with no placeholder,
# for the same reasons as the BigCommerce secrets above.

# Sign in with Apple identifiers (Phase 2.3.2, src/auth/authjs.ts) - not
# secret, the legacy app's real values. The key ID/private key and Google
# OAuth credentials are secrets with deliberately no placeholder here (see
# SESSION_SIGNING_KEY in src/index.ts): set via `wrangler secret put`.
AUTH_APPLE_ID = "es.losverd.card"
APPLE_SIGNIN_TEAM_ID = "KJHZP635V9"

# Email card delivery (src/member/email-card.tsx) - not secret, the legacy
# app's real sender identity and SendGrid ASM unsubscribe group
# (EMAIL_FROM_ADDRESS/EMAIL_FROM_NAME/SENDGRID_GROUP_ID in digital-membership's
# settings.py). SENDGRID_API_KEY and TURNSTILE_SECRET_KEY are secrets with no
# placeholder here; TURNSTILE_SITE_KEY still needs a real value (see
# src/index.ts).
EMAIL_FROM_ADDRESS = "verde-bot@losverd.es"
EMAIL_FROM_NAME = "Los Verdes (verde-bot)"
SENDGRID_UNSUBSCRIBE_GROUP_ID = "29631"

# Cloudflare Queues (Phase 2.5.2). The queues themselves are provisioned by
# terraform/queues.tf; bindings live here. src/index.ts's queue() handler
# routes batches by queue name.
[[queues.producers]]
queue = "etl-sync"
binding = "ETL_SYNC_QUEUE"

# Concurrency 1: a webhook-triggered order sync and a scheduled full resync
# never race each other's D1 writes, and BigCommerce rate limits aren't hit
# by parallel syncs (Phase 2.5.1).
[[queues.consumers]]
queue = "etl-sync"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 5
max_concurrency = 1
dead_letter_queue = "etl-sync-dlq"

[[queues.consumers]]
queue = "etl-sync-dlq"
max_batch_size = 10
max_retries = 0

# No [triggers] crons yet: the scheduled ETL jobs (src/scheduled.ts) would
# call BigCommerce with placeholder credentials until real secrets are set.

# No named Wrangler environments: this single Worker is production, even
# before card.losverd.es points at it. Keep it that way -- named environments
# don't inherit top-level vars/bindings at all, which once silently shipped a
# Worker with none (see the migration plan's Handoff note).
