name = "card-losverd-es"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat", "enable_nodejs_inspector_module"]

# Non-JS static assets bundled directly into the Worker via Wrangler's
# esbuild-based bundler at build time (rather than fetched at request time or
# read from R2). Added for the Phase 1.0.2 card-rendering spike
# (src/spikes/card-rendering): the Bungee font Satori needs as a raw font
# buffer, and the placeholder crest logo Satori needs as a base64 data URL
# input. `.wasm` needs no entry here -- Wrangler resolves that to a
# WebAssembly.Module by default.
[[rules]]
type = "Data"
globs = ["**/*.woff", "**/*.png"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "card-losverd-es-db"
database_id = "REPLACE_WITH_TERRAFORM_OUTPUT_d1_database_id"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "card-losverd-es-assets"

[vars]
# BigCommerce store/app identifiers - not secret, safe to commit (see
# docs/bigcommerce-ingestion.md).
BIGCOMMERCE_STORE_HASH = "REPLACE_WITH_BIGCOMMERCE_STORE_HASH"
BIGCOMMERCE_CLIENT_ID = "REPLACE_WITH_BIGCOMMERCE_CLIENT_ID"
# Placeholders only, so local dev/test envs have *something* bound (matches
# the `REPLACE_WITH_TERRAFORM_OUTPUT_...` pattern above). Real values MUST
# be set per-environment via `wrangler secret put` before deploying - see
# docs/bigcommerce-ingestion.md sections 1 and 5.
BIGCOMMERCE_ACCESS_TOKEN = "REPLACE_WITH_WRANGLER_SECRET"
BIGCOMMERCE_WEBHOOK_SIGNING_KEY = "REPLACE_WITH_WRANGLER_SECRET"

# TODO(Phase 2.5.2): etl-sync queue producer/consumer config isn't set up
# yet - see docs/bigcommerce-ingestion.md sections 3 and 5.
# [[queues.producers]]
# queue = "etl-sync"
# binding = "ETL_SYNC_QUEUE"

[env.preview]
name = "card-losverd-es-preview"

[env.production]
name = "card-losverd-es"
