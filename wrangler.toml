name = "card-losverd-es"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat", "enable_nodejs_inspector_module"]

# Non-JS static assets bundled directly into the Worker via Wrangler's
# esbuild-based bundler at build time (rather than fetched at request time or
# read from R2). Added for the Phase 1.0.2 card-rendering spike
# (src/spikes/card-rendering): the Bungee font Satori needs as a raw font
# buffer, and the placeholder crest logo Satori needs as a base64 data URL
# input. `.wasm` needs no entry here -- Wrangler resolves that to a
# WebAssembly.Module by default.
[[rules]]
type = "Data"
globs = ["**/*.woff", "**/*.png"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "card-losverd-es-db"
database_id = "REPLACE_WITH_TERRAFORM_OUTPUT_d1_database_id"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "card-losverd-es-assets"

[env.preview]
name = "card-losverd-es-preview"

[env.production]
name = "card-losverd-es"
