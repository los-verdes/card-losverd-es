name = "card-losverd-es-production"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

# Workers Logs: keeps every invocation's console output and uncaught errors
# for 7 days, searchable in the dashboard, rather than only while
# `wrangler tail` is attached. Workers Paid includes 20M log events a month.
[observability]
enabled = true
head_sampling_rate = 1

# Non-JS static assets bundled directly into the Worker via Wrangler's
# esbuild-based bundler at build time (rather than fetched at request time or
# read from R2). `src/cardimage/render.ts` needs this for the raw Bungee
# font buffer Satori requires; the `.png` glob also covers
# `test/fixtures/sample-logo.png`, imported the same way by that module's
# tests. `.wasm` needs no entry here -- Wrangler resolves that to a
# WebAssembly.Module by default.
[[rules]]
type = "Data"
globs = ["**/*.woff", "**/*.png"]
fallthrough = true

# The production hostname, as a Workers Custom Domain: Cloudflare manages its
# proxied DNS record and certificate. A Custom Domain cannot be created while
# any other record exists for the name, which is why the previous site's
# `card` CNAME was deleted by hand before this was first deployed
# (docs/cutover.md) -- the deploy token has no DNS permission.
#
# Production only. Routes are the one thing named environments *do* inherit,
# so [env.staging] sets `routes = []`; without it staging, deployed first,
# would claim this hostname. `just check-wrangler-envs` fails if it ever does.
#
# Once a route exists, Wrangler stops serving the Worker on its workers.dev
# hostname unless `workers_dev` says otherwise, so production answers on
# card.losverd.es alone; its workers.dev hostname is retired.
[[routes]]
pattern = "card.losverd.es"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "card-losverd-es-db-production"
database_id = "2205f64b-4273-45b7-91e3-a544b686392c"
# Wrangler defaults to looking for a top-level `migrations/` directory --
# ours lives at src/db/migrations (see Phase 2.1). Without this, `wrangler
# d1 migrations apply` fails with "No migrations present at .../migrations"
# -- this is why every Deploy workflow run has failed since the very first
# merge to main.
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "card-losverd-es-assets-production"

# Cloudflare Email Service (#244). The binding is the credential: there is no
# API key. The sending domain has to be onboarded in this Cloudflare account,
# and who may actually receive mail is still decided by
# EMAIL_RECIPIENT_ALLOWLIST below, in code, whatever the binding would allow.
[[send_email]]
name = "EMAIL"

[vars]
# BigCommerce store/app identifiers - not secret, safe to commit (see
# docs/bigcommerce-ingestion.md). The store hash is the production store.
# BIGCOMMERCE_ACCESS_TOKEN and BIGCOMMERCE_WEBHOOK_SIGNING_KEY are secrets,
# set via `wrangler secret put` -- deliberately with NO placeholder here:
# `wrangler secret put` refuses a name already bound as a plain var, and a
# public placeholder signing key would let anyone forge webhook signatures.
BIGCOMMERCE_STORE_HASH = "3nco2w7eup"
BIGCOMMERCE_CLIENT_ID = "fsnukglh18ksbdvd1g5xh7f6hfpe2p8"

# Apple PassKit identifiers (Phase 4) - not secret, safe to commit (both are
# embedded in every issued pass). These are the legacy app's real values
# (`APPLE_DEVELOPER_PASS_TYPE_ID` / `APPLE_DEVELOPER_TEAM_ID` in
# digital-membership): the pass type ID must match the Apple Pass Type ID
# certificate used for signing, and is also the APNs push topic -- see
# docs/legacy-pass-compatibility.md.
PASSKIT_PASS_TYPE_IDENTIFIER = "pass.es.losverd.card"
PASSKIT_TEAM_IDENTIFIER = "KJHZP635V9"
PASSKIT_ORGANIZATION_NAME = "Los Verdes"
PASSKIT_WEB_SERVICE_URL = "https://card.losverd.es/passkit"
# Public origin for the signed /verify-pass URLs in membership card QR codes.
PUBLIC_BASE_URL = "https://card.losverd.es"
# Google Wallet (Phase 5). The issuer ID is the legacy app's. The legacy
# pass used a *loyalty* class; this stack issues *generic* objects, so this
# generic class must be created in the Google Pay & Wallet Console.
GOOGLE_WALLET_ISSUER_ID = "3388000000022031577"
GOOGLE_WALLET_CLASS_SUFFIX = "los_verdes_member_v1"
# The Apple Pass Type ID cert/key + WWDR intermediate (APPLE_PASS_CERT_PEM,
# APPLE_PASS_KEY_PEM, APPLE_WWDR_CERT_PEM) are secrets with no placeholder,
# for the same reasons as the BigCommerce secrets above.

# Sign in with Apple identifiers (Phase 2.3.2, src/auth/authjs.ts) - not
# secret, the legacy app's real values. The key ID/private key and Google
# OAuth credentials are secrets with deliberately no placeholder here (see
# SESSION_SIGNING_KEY in src/index.ts): set via `wrangler secret put`.
AUTH_APPLE_ID = "es.losverd.card"
APPLE_SIGNIN_TEAM_ID = "KJHZP635V9"

# Email card delivery (src/member/email-card.tsx) - not secret, the legacy
# app's real sender identity (EMAIL_FROM_ADDRESS/EMAIL_FROM_NAME in
# digital-membership's settings.py). Sending goes through the `send_email`
# binding above; TURNSTILE_SECRET_KEY is a secret with no placeholder here.
# Who this environment may email (#155). `*` is the only value that permits
# anyone; empty permits nobody. Production says whichever it means explicitly
# rather than inheriting one from a default -- an environment that loses this
# var sends to nobody.
#
# `*`: production may email any member. It was empty through the cutover's
# bulk steps -- reloading the legacy import, the full resync -- as a fourth
# guard beside the three in src/email/newOrder.ts, and opened once the full
# resync had finished. Emptying it again stops every email this environment
# sends, and /admin/preflight then fails, since members are being served.
EMAIL_RECIPIENT_ALLOWLIST = "*"
EMAIL_FROM_ADDRESS = "verde-bot@losverd.es"
EMAIL_FROM_NAME = "Los Verdes (verde-bot)"
# A Turnstile site key is public -- it's rendered into the /email-card form --
# so it belongs here rather than in the Worker secrets item. Each widget is
# bound to its own hostnames, so production and staging need separate ones.
# Empty until a widget exists for card.losverd.es, which leaves /email-card
# failing closed rather than rendering a widget that can never be solved.
TURNSTILE_SITE_KEY = "0x4AAAAAAE-1rj-sdiipmGPH"
# Empty until we're ready for new orders to email their member a card, so a
# backfill or resync can't mail existing members (src/email/newOrder.ts). Set
# it to the day sending is switched on, never a past date.
CARD_EMAIL_NEW_ORDERS_SINCE = ""

# Queue names src/queues/index.ts routes batches by (they differ per
# environment -- queue names are account-wide).
ETL_SYNC_QUEUE_NAME = "etl-sync-production"
ETL_SYNC_DLQ_NAME = "etl-sync-dlq-production"
# What this environment calls itself in anything a person reads -- currently
# the Slack alerts (src/slack/alert.ts). Spelled out rather than inferred from
# a queue name or a URL, so it stays right if either changes.
ENVIRONMENT = "production"
# Cloudflare Web Analytics site token for the member pages. Public: it is in
# every page's source (src/member/webAnalytics.tsx). Empty means no beacon.
WEB_ANALYTICS_TOKEN = "f90077d858e64cec9a68fadc25dd1d0d"
# The weekly readiness check posts an all-clear too, not only failures, so a
# run that happened is visible. Meant to go back to "" some while after
# cutover, once the job has earned trust (src/admin/readinessAlert.ts).
READINESS_POST_WHEN_HEALTHY = "true"

# Cloudflare Queues (Phase 2.5.2). The queues themselves are provisioned by
# terraform/queues.tf; bindings live here. src/index.ts's queue() handler
# routes batches by queue name.
[[queues.producers]]
queue = "etl-sync-production"
binding = "ETL_SYNC_QUEUE"

# Concurrency 1: a webhook-triggered order sync and a scheduled full resync
# never race each other's D1 writes, and BigCommerce rate limits aren't hit
# by parallel syncs (Phase 2.5.1).
[[queues.consumers]]
queue = "etl-sync-production"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 5
max_concurrency = 1
dead_letter_queue = "etl-sync-dlq-production"

[[queues.consumers]]
queue = "etl-sync-dlq-production"
max_batch_size = 10
max_retries = 0

# The scheduled jobs (src/scheduled.ts), on the same schedules as staging: the
# Slack members sync, the BigCommerce resync that repairs anything a webhook
# missed, and the weekly readiness check. See [env.staging.triggers] at the end
# of this file for why each runs when it does. A resync never emails anyone
# (src/email/newOrder.ts).
[triggers]
crons = ["0 */6 * * *", "15 */6 * * *", "0 9 * * 1"]

# =============================================================================
# Staging: a separate Worker (`card-losverd-es-staging`) with its own D1, R2,
# queues (terraform/staging.tf), vars, and secrets, pointed at the test
# BigCommerce store. Deploy with `just deploy staging`; set its secrets with
# `wrangler secret put NAME --env staging`.
#
# Named environments do NOT inherit top-level vars or bindings (only settings
# like `main`, `compatibility_*`, and `rules`) -- that once silently shipped a
# Worker with no bindings at all (see the migration plan's Handoff note). So
# everything below is spelled out in full, and `just check-wrangler-envs` (run
# in CI) fails if staging's var/binding names drift from production's, or if
# staging ever points at a production resource.
# =============================================================================
[env.staging]
name = "card-losverd-es-staging"
# Routes are the one thing named environments inherit, so without this
# staging -- deployed before production -- would claim production's custom
# domain (card.losverd.es, declared at the top level). Staging is served on
# its workers.dev hostname. `just check-wrangler-envs` fails if the two ever
# share a route.
routes = []

[[env.staging.d1_databases]]
binding = "DB"
database_name = "card-losverd-es-db-staging"
database_id = "c40987a2-5d2b-430b-a78e-31e64c666854"
migrations_dir = "src/db/migrations"

[[env.staging.r2_buckets]]
binding = "ASSETS"
bucket_name = "card-losverd-es-assets-staging"

[[env.staging.send_email]]
name = "EMAIL"

[env.staging.vars]
# The test BigCommerce store (legacy DevelopmentSettings' store hash).
BIGCOMMERCE_STORE_HASH = "kouyh8feen"
BIGCOMMERCE_CLIENT_ID = "g1vpjmv5bbedb6in9nzenavswbi18f9"
PASSKIT_PASS_TYPE_IDENTIFIER = "pass.es.losverd.card"
PASSKIT_TEAM_IDENTIFIER = "KJHZP635V9"
PASSKIT_ORGANIZATION_NAME = "Los Verdes"
PASSKIT_WEB_SERVICE_URL = "https://card-losverd-es-staging.los-verdes.workers.dev/passkit"
PUBLIC_BASE_URL = "https://card-losverd-es-staging.los-verdes.workers.dev"
GOOGLE_WALLET_ISSUER_ID = "3388000000022031577"
GOOGLE_WALLET_CLASS_SUFFIX = "los_verdes_member_staging_v1"
AUTH_APPLE_ID = "es.losverd.card.staging"
APPLE_SIGNIN_TEAM_ID = "KJHZP635V9"
# Staging may only email test mailboxes, so realistic member data is safe to
# hold here (#155). `losverd.es` runs Cloudflare Email Routing, so addresses
# like card-test@losverd.es are routing rules rather than real accounts.
# Anything else is suppressed and logged; it never throws.
EMAIL_RECIPIENT_ALLOWLIST = "losverd.es"
EMAIL_FROM_ADDRESS = "verde-bot@losverd.es"
EMAIL_FROM_NAME = "Los Verdes (verde-bot staging)"
# Staging's own Turnstile widget, bound to the workers.dev hostname above.
TURNSTILE_SITE_KEY = "0x4AAAAAAE-1onLnv0YsYEli"
# On, so the new-order email runs here ahead of production. The allowlist
# above keeps it to test mailboxes; the date is the day it was switched on,
# as the production comment requires.
CARD_EMAIL_NEW_ORDERS_SINCE = "2026-09-21"
ETL_SYNC_QUEUE_NAME = "etl-sync-staging"
ETL_SYNC_DLQ_NAME = "etl-sync-dlq-staging"
ENVIRONMENT = "staging"
# Cloudflare Web Analytics site token for the member pages. Public: it is in
# every page's source (src/member/webAnalytics.tsx). Empty means no beacon.
WEB_ANALYTICS_TOKEN = "b61d93fe2b704bd98f20d9e80c7c466b"
# The weekly readiness check posts an all-clear too, not only failures, so a
# run that happened is visible. Meant to go back to "" some while after
# cutover, once the job has earned trust (src/admin/readinessAlert.ts).
READINESS_POST_WHEN_HEALTHY = "true"

[[env.staging.queues.producers]]
queue = "etl-sync-staging"
binding = "ETL_SYNC_QUEUE"

[[env.staging.queues.consumers]]
queue = "etl-sync-staging"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 5
max_concurrency = 1
dead_letter_queue = "etl-sync-dlq-staging"

[[env.staging.queues.consumers]]
queue = "etl-sync-dlq-staging"
max_batch_size = 10
max_retries = 0

# Cron triggers, the same schedules as production's [triggers] block. Two
# mapped schedules are left out of both because they would only log that they
# are not implemented: "30 * * * *" (customers) and "30 */12 * * *" (MiniBC,
# not built -- docs/membership-card-provenance.md). A resync never emails
# anyone (src/email/newOrder.ts).
# The Slack sync reads staging's own Slack credentials (#133), never
# production's, so the real membership roll stays out of staging.
[env.staging.triggers]
# "0 */6 * * *" the Slack members sync; "15 */6 * * *" the BigCommerce resync;
# "0 9 * * 1" the weekly readiness check, which posts failures to Slack, and
# an all-clear while READINESS_POST_WHEN_HEALTHY is "true". Each maps to a
# message in src/scheduled.ts.
#
# The Slack sync is offset a quarter-hour from the resync rather than sharing
# its schedule: the queue runs one consumer at a time, so two jobs due
# together would simply queue behind each other, and staggering them keeps a
# slow run of one from delaying the other.
crons = ["0 */6 * * *", "15 */6 * * *", "0 9 * * 1"]
